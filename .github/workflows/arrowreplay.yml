# CI for the ArrowReplay fork. The jobs of the upstream release.yml only run
# on uvcat7's repository: without access to its NuGet package cache the
# Windows build compiles every vcpkg package each time and the Linux build
# hangs while adding the feed. This workflow keeps the packages in the
# Actions cache instead.

name: ArrowReplay

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish as a release, e.g. v0.2.0 (empty for a normal build)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  formatting:
    name: Check formatting
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting with clang-format
        shell: bash
        run: >
          clang-format --dry-run --Werror -style=file
          $(find src/ -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' -o -name '*.hpp' \))

  recorder:
    name: Recorder test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the recorder against a mocked ITGmania
        run: |
          python3 -m venv .venv
          .venv/bin/pip install lupa
          .venv/bin/python replay/tests/test_recorder.py replay/ArrowReplay.lua

  windows:
    name: Build Windows x64
    runs-on: windows-2022
    permissions:
      contents: write  # Publishing a release for an arrowreplay-v* tag.
    env:
      # Built packages are kept in the Actions cache, the first build (with
      # FFmpeg) takes about an hour, later ones a few minutes.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v7
      - name: Get the vcpkg version
        id: vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          "commit=$(git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-windows-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-
      - name: Configure CMake
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DYML=YML
      - name: Build
        run: cmake --build build --config Release --parallel "$env:NUMBER_OF_PROCESSORS"
      - name: Package like the release zip
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          New-Item -ItemType Directory -Force "package/Simply Love module", "package/Example" | Out-Null
          Move-Item dist/bin package/ArrowVortex
          Copy-Item replay/ArrowReplay.lua "package/Simply Love module/"
          Copy-Item "replay/tests/example - Into You (SRPG10).avreplay" package/Example/
      - uses: actions/upload-artifact@v7
        with:
          name: ArrowReplay-win64-${{ github.sha }}
          path: package/
          if-no-files-found: error
      # Runs the built ArrowVortex on generated replays of the test chart and
      # checks that its summary has the judgments the replays were made with.
      - name: Test the replay viewer
        shell: pwsh
        timeout-minutes: 10
        run: |
          $chart = "$pwd\replay\tests\test_chart.sm"
          $cases = @{
            "normal" = @("--seed", "1")
            "rate" = @("--rate", "1.25", "--global-offset", "-0.008", "--sync-offset", "-0.009", "--seed", "2")
          }
          foreach ($name in $cases.Keys) {
            Write-Host "== $name"
            python replay/tests/make_test_replay.py $chart "/Songs/ArrowReplay Tests/Test Chart/test_chart.sm" "$name.avreplay" --truth "$name.json" @($cases[$name])
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $av = Start-Process -FilePath "package\ArrowVortex\ArrowVortex.exe" -Wait -PassThru -ArgumentList @(
              "--replay-report", "`"$pwd\$name.avreplay`"", "`"$chart`"", "`"$pwd\$name.txt`"")
            Write-Host "ArrowVortex exit code: $($av.ExitCode)"
            python replay/tests/check_report.py "$name.txt" "$name.json"
            if ($LASTEXITCODE -ne 0 -or $av.ExitCode -ne 0) { exit 1 }
          }
      # Publishes the tested build as a release, for a pushed arrowreplay-v*
      # tag or when the workflow is run by hand with a version. The release
      # notes are replay/release-notes.md.
      - name: Publish the release
        if: >-
          startsWith(github.ref, 'refs/tags/arrowreplay-v') ||
          (github.event_name == 'workflow_dispatch' && inputs.release != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release || github.ref_name }}
        run: |
          $version = $env:VERSION -replace '^arrowreplay-', ''
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw "Not a version: $version" }
          $tag = "arrowreplay-$version"
          $zip = "ArrowReplay-$version-win64.zip"
          Compress-Archive -Path package\* -DestinationPath $zip
          gh release create $tag $zip --target $env:GITHUB_SHA --title "ArrowReplay $version" --notes-file replay/release-notes.md
